<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울 전시 — 지금 하는 전시의 기간과 관람료</title>
  <meta name="description" content="서울에서 지금 진행 중인 전시의 기간과 관람료를 한눈에 봅니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="wrap masthead">
    <h1><a href="./">서울 전시</a></h1>
    <p id="summary">전시 목록을 불러오는 중…</p>
  </header>

  <div class="controls">
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="전시 필터"></div>
      <div class="selects">
        <label><span>정렬</span>
          <select id="sort">
            <option value="end">곧 끝나는 순</option>
            <option value="new">최근 시작한 순</option>
            <option value="near">가까운 순</option>
          </select>
        </label>
        <label><span>지역</span>
          <select id="gu"><option value="">서울 전체</option></select>
        </label>
      </div>
      <p class="notice" id="notice" role="status"></p>
    </div>
  </div>

  <main class="wrap">
    <ul class="grid" id="grid"></ul>
  </main>

  <footer>
    <div class="wrap">
      <p>자료: 한국문화정보원 한눈에보는문화정보 (공공데이터포털). <span id="updated"></span></p>
      <p>휴관일과 운영시간은 싣지 않습니다. 방문 전에 각 기관 안내를 확인하세요.</p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
